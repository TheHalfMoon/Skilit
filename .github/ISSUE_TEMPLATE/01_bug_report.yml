name: "Bug report"
description: "Report a reproducible Skilit defect (not a security vulnerability)."
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping Skilit. Do not post vulnerabilities, real API tokens, session cookies, private URLs or workspace data. Do not use this form for security issues: if GitHub private vulnerability reporting is enabled, use it; otherwise arrange a private channel with the repository maintainers before sharing vulnerability details.
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - Web / authentication
        - Lens / Build Kit
        - Gallery / Patterns / Boards / Flows
        - MCP / REST / SDK
        - Capture / worker
        - Storage / database
        - Documentation / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Observed behavior
      description: Describe the actual failure without secrets or private data.
      placeholder: The interface displayed X after I performed Y.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Prefer synthetic data and an isolated local workspace.
      placeholder: |
        1. Start Skilit with ...
        2. Navigate to ...
        3. Perform ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Exact version, commit SHA or PR number
      placeholder: "abc1234 or PR #123"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local macOS
        - Local Windows
        - Local Linux
        - CI / test runner
        - Other / unknown
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots (optional)
      description: Redact credentials, emails, private URLs, cookies and workspace contents.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched for duplicate reports and removed sensitive material.
          required: true
