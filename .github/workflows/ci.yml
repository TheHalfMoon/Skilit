name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skilit-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install pinned CI dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: --requirement requirements-ci.txt

      - name: Verify exact HEAD and repository hygiene
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_hygiene.py --expected-head "$EXPECTED_HEAD"

      - name: Compile bootstrap Python
        run: python -m compileall -q scripts tests

      - name: Set up Node.js for interop wire tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate upstream provenance lock
        run: python scripts/validate_upstreams.py

      - name: Validate Lens Build Kit contract
        run: python scripts/validate_build_kit.py

      - name: Validate agent skills
        run: python scripts/validate_skills.py

      - name: Validate agent contract
        run: python scripts/validate_agent_contract.py

  graft:
    name: graft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js for pinned Graft
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Build Graft context graph
        run: npx --yes @nanonets/graft@0.21.1 build --no-gitignore --no-ignore .

      - name: Verify Graft freshness
        run: npx --yes @nanonets/graft@0.21.1 check .

  no-model:
    name: no-model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install pinned CI dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: --requirement requirements-ci.txt

      - name: Zero-model egress gate on clean strict env
        env:
          SKILIT_NO_MODEL: "1"
        run: python scripts/check_no_model.py --root .

      - name: Zero-model gate fails closed on forbidden credential
        shell: bash
        run: |
          set -euo pipefail
          if SKILIT_NO_MODEL=1 OPENAI_API_KEY=sk-ci-fixture-only python scripts/check_no_model.py --root .; then
            echo "expected gate to fail with OPENAI_API_KEY present" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint no-model package
        run: pnpm --filter skilit-no-model lint

      - name: Strict typecheck no-model package
        run: pnpm --filter skilit-no-model typecheck

      - name: Run zero-model conformance tests
        run: node --experimental-strip-types --test packages/no-model/tests/no-model.test.mjs

      - name: Worker strict health on clean env
        env:
          SKILIT_NO_MODEL: "1"
        run: pnpm --dir apps/worker start health

      - name: Worker fails closed on invalid flag
        shell: bash
        run: |
          set -euo pipefail
          if SKILIT_NO_MODEL=strict pnpm --dir apps/worker start health; then
            echo "expected worker health to fail with invalid SKILIT_NO_MODEL" >&2
            exit 1
          fi

  web:
    name: web
    runs-on: ubuntu-24.04
    # The job also downloads the pinned Chromium headless shell and boots the
    # production server once per browser-smoke scenario, so it needs more
    # than the 15-minute timeout the plain build-and-test jobs use.
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web application
        run: pnpm --dir apps/web lint

      - name: Strict typecheck
        run: pnpm --dir apps/web typecheck

      - name: Run Node.js tests
        run: node --experimental-strip-types --test "tests/node/*.test.mjs" "apps/web/tests/*.test.mjs" "apps/worker/tests/*.test.mjs"

      - name: Validate component registry
        run: python scripts/validate_registry.py

      - name: Production build
        run: pnpm --dir apps/web build 2>&1 | tee /tmp/skilit-build.log

      - name: Bundle budget rollback check
        run: node scripts/check_bundle_budget.mjs --build-output /tmp/skilit-build.log

      - name: Production startup smoke
        run: node scripts/smoke-web.mjs 3103

      - name: Install pinned Playwright Chromium headless shell
        run: node packages/lens/node_modules/playwright-core/cli.js install chromium-headless-shell

      - name: Brand chrome responsive and keyboard smoke
        run: node scripts/smoke-brand-chrome.mjs 3104

      - name: Authenticated browser journey smoke
        run: node scripts/smoke-auth-journey.mjs 3105

      - name: Clean-consumer registry install proof
        run: node scripts/prove_registry_install.mjs

  worker:
    name: worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint worker
        run: pnpm --dir apps/worker lint

      - name: Strict typecheck
        run: pnpm --dir apps/worker typecheck

      - name: Run worker tests
        run: node --experimental-strip-types --test "apps/worker/tests/*.test.mjs"

      - name: Worker health command
        run: pnpm --dir apps/worker start health

  skilit-screenshot-queue:
    name: skilit-screenshot-queue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Typecheck the isolated capture module (vendored implementation detail)
        run: >-
          npx --yes --package=typescript@5.9.3 tsc
          --noEmit --strict --target ES2022
          --module NodeNext --moduleResolution NodeNext
          packages/providers/monet/screenshot/queue.ts

      - name: Run Node.js queue contract tests
        run: node --experimental-strip-types --test tests/node/skilit-screenshot-queue.test.mjs

  providers:
    name: providers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint providers package
        run: pnpm --filter skilit-providers lint

      - name: Strict typecheck providers package
        run: pnpm --filter skilit-providers typecheck

      - name: Run provider contract tests
        run: node --experimental-strip-types --test packages/providers/tests/provider.test.mjs

  editor-adapters:
    name: editor-adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint editor adapters package
        run: pnpm --filter skilit-editor-adapters lint

      - name: Strict typecheck editor adapters package
        run: pnpm --filter skilit-editor-adapters typecheck

      - name: Run vector adapter tests
        run: node --experimental-strip-types --test packages/editor-adapters/tests/vector-adapter.test.mjs

      - name: Run raster adapter tests
        run: node --experimental-strip-types --test packages/editor-adapters/tests/raster-adapter.test.mjs

      - name: Run OpenPencil adapter tests
        run: node --experimental-strip-types --test packages/editor-adapters/tests/openpencil-adapter.test.mjs

  ingest:
    name: ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint ingest package
        run: pnpm --filter skilit-ingest lint

      - name: Strict typecheck ingest package
        run: pnpm --filter skilit-ingest typecheck

      - name: Run publish pipeline tests
        run: >-
          node --experimental-strip-types --test
          packages/ingest/tests/publish.test.mjs
          packages/ingest/tests/corpus.test.mjs

  assets:
    name: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint assets package
        run: pnpm --filter skilit-assets lint

      - name: Strict typecheck assets package
        run: pnpm --filter skilit-assets typecheck

      - name: Run asset registry tests
        run: >-
          node --experimental-strip-types --test
          packages/assets/tests/assets.test.mjs
          packages/assets/tests/iconset.test.mjs
          packages/assets/tests/brandfont.test.mjs
          packages/assets/tests/similarity.test.mjs
          packages/assets/tests/compare.test.mjs

  sdk:
    name: sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint TypeScript SDK
        run: pnpm --filter skilit-sdk lint

      - name: Strict typecheck TypeScript SDK
        run: pnpm --filter skilit-sdk typecheck

      - name: Run TypeScript SDK tests
        run: node --experimental-strip-types --test packages/sdk-ts/tests/client.test.mjs

  lens:
    name: lens
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Lens package
        run: pnpm --filter skilit-lens lint

      - name: Strict typecheck Lens package
        run: pnpm --filter skilit-lens typecheck

      - name: Install pinned Playwright Chromium headless shell
        run: node packages/lens/node_modules/playwright-core/cli.js install chromium-headless-shell

      - name: Run Lens tests including isolated Chromium capture
        run: >-
          node --experimental-strip-types --test
          packages/lens/tests/url-guard.test.mjs
          packages/lens/tests/design-tokens.test.mjs
          packages/lens/tests/capture-network.test.mjs
          packages/lens/tests/capture-browser.test.mjs
          packages/lens/tests/report-assembly.test.mjs
          packages/lens/tests/style-evidence.test.mjs
          packages/lens/tests/export-surface.test.mjs
          packages/lens/tests/tech-signal-evidence.test.mjs
          packages/lens/tests/tech-clue-matcher.test.mjs
          packages/lens/tests/analyze-url.test.mjs
          packages/lens/tests/capture-scope.test.mjs
          packages/lens/tests/capture-traversal.test.mjs
          packages/lens/tests/kit-manifest.test.mjs
          packages/lens/tests/kit-package.test.mjs
          packages/lens/tests/starter-synthesis.test.mjs
          packages/lens/tests/three-page-fixture.test.mjs
          packages/lens/tests/kit-fixture-chain.test.mjs
          packages/lens/tests/no-paid-path.test.mjs
          packages/lens/tests/video-frame-evidence.test.mjs
          packages/lens/tests/video-evidence-attachment.test.mjs

      - name: Clean-consumer starter smoke
        run: node --experimental-strip-types scripts/prove_starter_consumer.mjs --port=3127

  db-foundation:
    name: db-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: skilit_test
          POSTGRES_USER: skilit_test
          POSTGRES_PASSWORD: local_ci_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skilit_test -d skilit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint DB package
        run: pnpm --filter skilit-db lint

      - name: Strict typecheck DB package
        run: pnpm --filter skilit-db typecheck

      - name: Run DB migration and domain tests
        run: >-
          node --experimental-strip-types --test
          packages/db/tests/backup-restore.test.mjs
          packages/db/tests/migration-rehearsal.test.mjs
          packages/db/tests/db-foundation.test.mjs
          packages/db/tests/graph.test.mjs
          packages/db/tests/artifact-access.test.mjs
          packages/db/tests/workflows.test.mjs
          packages/db/tests/changes.test.mjs
          packages/db/tests/gallery.test.mjs
          packages/db/tests/patterns.test.mjs
          packages/db/tests/replay.test.mjs
          packages/db/tests/auth.test.mjs
          packages/db/tests/account-sessions.test.mjs
          packages/db/tests/invites.test.mjs
          packages/db/tests/workspaces.test.mjs
          packages/db/tests/collections.test.mjs
          packages/db/tests/billing.test.mjs
          packages/db/tests/jobs.test.mjs
          packages/db/tests/build-kit.test.mjs

      - name: Real PostgreSQL transaction and concurrency integration tests
        env:
          SKILIT_TEST_DATABASE_URL: postgresql://skilit_test:local_ci_fixture_only@127.0.0.1:5432/skilit_test
          SKILIT_DB_TEST_CONFIRM: "yes"
        run: |
          node --experimental-strip-types --test packages/db/tests/pg-integration.test.mjs
          node --experimental-strip-types --test packages/db/tests/pg-graph.test.mjs
          node --experimental-strip-types --test packages/db/tests/pg-workflows.test.mjs
          node --experimental-strip-types --test packages/db/tests/pg-build-kit.test.mjs
          node --experimental-strip-types --test packages/db/tests/pg-backup-restore.test.mjs

  storage:
    name: storage-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint storage package
        run: pnpm --filter skilit-storage lint

      - name: Strict typecheck storage package
